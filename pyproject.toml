[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "r2mem-method"
version = "0.1.0"
description = "Robot-independent R2Mem core with stage-1 and stage-2 PyTorch training interfaces"
requires-python = ">=3.11"
dependencies = ["torch>=2.7,<3", "numpy>=1.26", "PyYAML>=6", "safetensors>=0.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
